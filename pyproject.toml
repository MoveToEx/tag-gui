[project]
name = "tag-gui"
version = "0.1.0"
description = "A Qt desktop application for editing image tag sidecars"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyside6>=6.8,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-qt>=4.4,<5",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
