[project]
name = "tagger"
version = "0.1.0"
description = "A Qt desktop application for editing image tag sidecars"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyside6>=6.8,<7",
]

[dependency-groups]
ai-tagger = [
    "huggingface-hub>=1.29.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "timm>=1.0.29",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]
dev = [
    "pytest>=8.3,<10",
    "pytest-qt>=4.4,<5",
    "ty>=0.0.73",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130" },
]
torchvision = [
    { index = "pytorch-cu130" },
]
